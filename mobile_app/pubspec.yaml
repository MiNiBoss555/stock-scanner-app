name: stock_scanner_mobile
description: Cross-platform stock scanner app for iOS and Android.
publish_to: "none"
version: 1.0.23+24

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  file_picker: ^12.0.0-beta.5
  image_picker: ^1.1.2
  mobile_scanner: ^7.2.0
  barcode_widget: ^2.0.4
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.4
  qr_flutter: ^4.1.0
  share_plus: ^13.1.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  excel: ^4.0.0
  google_mlkit_text_recognition: ^0.13.0
  image_cropper: ^12.2.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  google_mlkit_document_scanner: ^0.4.1
  image: ^4.3.0
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/scan_product_logo.png
    - assets/branding/scan_product_logo_mark.png
    - assets/branding/scan_product_logo_mark_tight.png
    - assets/delivery/delivery_success.gif
    - assets/web_hero.jpg
